name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clipcore-linux:
    name: ClipCore (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - name: Test the clip logic
        run: swift test --package-path Packages/ClipCore

  ios:
    name: iOS app (simulator)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODE: /Applications/Xcode_26.6.app
      SIMULATOR: iPhone 17
      RUNTIME: "26.5"
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Check the string catalog
        run: python3 scripts/check_strings.py
      - name: Test the clip logic (macOS)
        run: swift test --package-path Packages/ClipCore
      - name: Start booting the simulator
        # Booting a fresh simulator takes minutes; it runs while the app compiles.
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in data.items():
              if runtime.endswith("iOS-" + os.environ["RUNTIME"].replace(".", "-")):
                  for device in devices:
                      if device["name"] == os.environ["SIMULATOR"]:
                          print(device["udid"]); sys.exit()
          sys.exit("simulator not found")')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
      - name: Build for testing
        run: |
          set +e
          xcodebuild build-for-testing \
            -project Autoklipp.xcodeproj \
            -scheme Autoklipp \
            -destination "id=$UDID" > build.log 2>&1
          status=$?
          grep -E '(error:|BUILD (SUCCEEDED|FAILED)|TEST BUILD)' build.log | tail -n 100
          if [ $status -ne 0 ]; then tail -n 80 build.log; fi
          exit $status
      - name: Fetch a public-domain portrait for the face test
        # Official portraits in the public domain on Wikimedia Commons. If none can be fetched,
        # the face part of the analysis tests is skipped.
        run: |
          for name in Abraham_Lincoln_O-77_matte_collodion_print.jpg Neil_Armstrong_pose.jpg; do
            if curl -fsSL -A "AutoklippCI/1.0 (https://github.com/lingu78/autoklipp)" \
                "https://commons.wikimedia.org/wiki/Special:FilePath/$name?width=600" -o "$RUNNER_TEMP/portrait.jpg"; then
              file "$RUNNER_TEMP/portrait.jpg" && break
            fi
          done || true
      - name: Wait for the simulator and grant Photos add access
        run: |
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl privacy "$UDID" grant photos-add se.autoklipp.app
          # Full access for ImportStressTests, which picks items from the library by identifier.
          xcrun simctl privacy "$UDID" grant photos se.autoklipp.app
      - name: Test
        env:
          TEST_RUNNER_AUTOKLIPP_CI: "1"
          TEST_RUNNER_AUTOKLIPP_FACE_IMAGE: ${{ runner.temp }}/portrait.jpg
          TEST_RUNNER_AUTOKLIPP_SCREENSHOTS: ${{ runner.temp }}/screenshots
          # The App Store's product page images (AppStore/README.md), made on this job only.
          TEST_RUNNER_AUTOKLIPP_STORE_ASSETS: "1"
        run: |
          set +e
          # One test at a time: the runner has three cores and the export tests are heavy.
          xcodebuild test-without-building \
            -project Autoklipp.xcodeproj \
            -scheme Autoklipp \
            -destination "id=$UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult > xcodebuild.log 2>&1
          status=$?
          grep -E '(error:|Test [Cc]ase .*(passed|failed)|Test run|Executed|recorded an issue|✘|TEST (SUCCEEDED|FAILED)|EXECUTE)' xcodebuild.log | tail -n 400
          grep -E '^(.*\] )?[a-zA-Z ]+: .* (ms|s)$|BPM detected|took|after [0-9]|sharpness|shake|average clip|^playback|^generation still running|^compositor|^import stress|^store asset' xcodebuild.log | grep -v '◇' | tail -n 60
          if [ $status -ne 0 ]; then tail -n 80 xcodebuild.log; fi
          exit $status
      - name: Screenshots
        # The start screen, drawn by ScreenshotTests; small copies are logged as base64 lines.
        if: always()
        run: |
          ls -la "$RUNNER_TEMP/screenshots" 2>/dev/null || echo "no screenshots"
          grep -o 'SCREENSHOT:[A-Za-z0-9:+/=_-]*' xcodebuild.log 2>/dev/null || true
      - name: Swedish App Store images
        # The product page images again with the app in Swedish, the primary language of the
        # App Store page; they go to store/sv/ and the log lines start with store-sv-.
        env:
          TEST_RUNNER_AUTOKLIPP_CI: "1"
          TEST_RUNNER_AUTOKLIPP_SCREENSHOTS: ${{ runner.temp }}/screenshots
          TEST_RUNNER_AUTOKLIPP_STORE_ASSETS: "1"
          TEST_RUNNER_AUTOKLIPP_STORE_LANGUAGE: sv
        run: |
          set +e
          xcodebuild test-without-building \
            -project Autoklipp.xcodeproj \
            -scheme Autoklipp \
            -destination "id=$UDID" \
            -parallel-testing-enabled NO \
            -only-testing:AutoklippTests/StoreAssetsTests \
            -testLanguage sv \
            -testRegion SE > store-sv.log 2>&1
          status=$?
          grep -E '(error:|Test run|recorded an issue|✘|TEST (SUCCEEDED|FAILED)|^store asset)' store-sv.log | tail -n 60
          grep -o 'SCREENSHOT:store-sv-[A-Za-z0-9:+/=_-]*' store-sv.log || true
          if [ $status -ne 0 ]; then tail -n 60 store-sv.log; fi
          exit $status
      - name: Keep screenshots
        if: always()
        # Artifacts are a convenience (the log has small copies); slow storage must not fail CI.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Autoklipp.xcodeproj \
            -scheme Autoklipp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 20
      - name: Keep test results
        if: failure()
        # Artifacts are a convenience (the log has small copies); slow storage must not fail CI.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
            build.log
          retention-days: 7

  ios-27:
    # iPhone Duo needs Xcode 27.1 and the iOS 27.1 SDK; iPhone 17 on the same SDK checks that
    # ordinary iPhones are unchanged. The job above keeps covering iOS 26 and Xcode 26.
    name: Xcode 27.1 (${{ matrix.simulator }})
    runs-on: xcode-27
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - simulator: iPhone Duo
            runtime: "27.1"
          # The image's iOS 27.1 runtime runs only iPhone Duo; an ordinary iPhone gets the
          # newest iOS 27 runtime that has it.
          - simulator: iPhone 17
            runtime: ""
    env:
      XCODE_VERSION: "27.1"
      SIMULATOR: ${{ matrix.simulator }}
      RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null | sort | head -n 1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          version=$(xcodebuild -version)
          echo "$version"
          swift --version
          [[ "$version" == "Xcode ${XCODE_VERSION}"* ]] || { echo "::error::Xcode $XCODE_VERSION not found"; exit 1; }
      - name: Start booting the simulator
        # A device missing on the wanted runtime is created; without a wanted runtime, the
        # newest iOS 27 runtime with the device is used.
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, re, sys
          wanted = os.environ.get("RUNTIME", "")
          found = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)$", runtime)
              if not match or (wanted and wanted != f"{match[1]}.{match[2]}") or int(match[1]) < 27:
                  continue
              for device in devices:
                  if device["name"] == os.environ["SIMULATOR"]:
                      found.append(((int(match[1]), int(match[2])), device["udid"], runtime))
          if found:
              version, udid, runtime = max(found)
              print(udid)
              print(runtime, file=sys.stderr)')
          if [ -z "$UDID" ]; then
            RUNTIME_ID=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, os, sys
          runtimes = json.load(sys.stdin)["runtimes"]
          print(next(r["identifier"] for r in runtimes if r.get("platform", "iOS") == "iOS" and r["version"] == os.environ["RUNTIME"]))')
            TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, os, sys
          types = json.load(sys.stdin)["devicetypes"]
          print(next(t["identifier"] for t in types if t["name"] == os.environ["SIMULATOR"]))')
            UDID=$(xcrun simctl create "$SIMULATOR" "$TYPE_ID" "$RUNTIME_ID")
            echo "Created $SIMULATOR ($TYPE_ID) on $RUNTIME_ID"
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
      - name: The simulated device
        # The screens the simulator has, for the sizes in DECISIONS.md and the fold tests.
        run: |
          profile=$(find "$(xcode-select -p)/Platforms/iPhoneOS.platform" /Library/Developer/CoreSimulator/Profiles \
            -path "*${SIMULATOR}.simdevicetype/Contents/Resources/profile.plist" 2>/dev/null | head -n 1)
          if [ -n "$profile" ]; then plutil -p "$profile" | grep -iE "screen|display|scale|width|height|size" | head -n 60; fi
          xcrun simctl io "$UDID" enumerate || true
      - name: Build for testing
        run: |
          set +e
          xcodebuild build-for-testing \
            -project Autoklipp.xcodeproj \
            -scheme Autoklipp \
            -destination "id=$UDID" > build.log 2>&1
          status=$?
          grep -E '(error:|warning: .*(deprecated|unavailable)|BUILD (SUCCEEDED|FAILED)|TEST BUILD)' build.log | tail -n 100
          if [ $status -ne 0 ]; then tail -n 80 build.log; fi
          exit $status
      - name: Wait for the simulator and grant Photos add access
        run: |
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl privacy "$UDID" grant photos-add se.autoklipp.app
          # Full access for ImportStressTests, which picks items from the library by identifier.
          xcrun simctl privacy "$UDID" grant photos se.autoklipp.app
      - name: Test
        env:
          TEST_RUNNER_AUTOKLIPP_CI: "1"
          TEST_RUNNER_AUTOKLIPP_SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: |
          set +e
          xcodebuild test-without-building \
            -project Autoklipp.xcodeproj \
            -scheme Autoklipp \
            -destination "id=$UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult > xcodebuild.log 2>&1
          status=$?
          grep -E '(error:|Test [Cc]ase .*(passed|failed)|Test run|Executed|recorded an issue|✘|TEST (SUCCEEDED|FAILED)|EXECUTE)' xcodebuild.log | tail -n 400
          grep -E '^(screen|playback|generation still running|compositor|import stress|store asset)' xcodebuild.log | head -n 80
          if [ $status -ne 0 ]; then tail -n 80 xcodebuild.log; fi
          exit $status
      - name: Screenshots
        if: always()
        run: |
          ls -la "$RUNNER_TEMP/screenshots" 2>/dev/null || echo "no screenshots"
          grep -o 'SCREENSHOT:[A-Za-z0-9:+/=_-]*' xcodebuild.log 2>/dev/null || true
      - name: The app on each display
        # The app launched on its own, captured on every display the simulator has.
        if: always()
        run: |
          xcrun simctl launch "$UDID" se.autoklipp.app || exit 0
          sleep 8
          mkdir -p "$RUNNER_TEMP/screenshots"
          # iPhone Duo's outer and inner displays are "primary" and "primary-1".
          for display in primary primary-1; do
            file="$RUNNER_TEMP/screenshots/simulator-$display.png"
            if xcrun simctl io "$UDID" screenshot --display="$display" "$file" 2>/dev/null; then
              sips -Z 700 -s format jpeg -s formatOptions 60 "$file" --out "$RUNNER_TEMP/small.jpg" > /dev/null
              base64 -i "$RUNNER_TEMP/small.jpg" | tr -d '\n' | fold -w 3000 | awk -v name="simulator-$display" '{ print "SCREENSHOT:" name ":" NR-1 ":" $0 }'
            fi
          done
      - name: Keep screenshots
        if: always()
        # Artifacts are a convenience (the log has small copies); slow storage must not fail CI.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-ios27-${{ matrix.simulator == 'iPhone Duo' && 'duo' || 'iphone' }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep test results
        if: failure()
        # Artifacts are a convenience (the log has small copies); slow storage must not fail CI.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ios27-${{ matrix.simulator == 'iPhone Duo' && 'duo' || 'iphone' }}
          path: |
            TestResults.xcresult
            xcodebuild.log
            build.log
          retention-days: 7
