name: TestFlight

# Builds a signed release and uploads it to App Store Connect, so the app can be installed on an
# iPhone with TestFlight without owning a Mac. Started by hand; needs the secrets in RELEASE.md.
on:
  workflow_dispatch:

jobs:
  upload:
    name: Archive and upload
    # Xcode 27.1 and the iOS 27.1 SDK: on iPhone Duo the app then uses the whole display and the
    # system puts its bars on the side. The app still runs on iOS 26.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      XCODE_VERSION: "27.1"
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'se.autoklipp.app' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check the secrets
        env:
          PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=0
          for name in TEAM_ID KEY_ID ISSUER_ID PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::A secret is missing ($name); see RELEASE.md"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null | sort | head -n 1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          xcodebuild -version | grep -q "^Xcode ${XCODE_VERSION}" || { echo "::error::Xcode $XCODE_VERSION not found"; exit 1; }
      - name: Write the App Store Connect key
        env:
          PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Archive
        # Unsigned: automatic signing would first sign for development, which needs a registered
        # device. The export below signs for distribution with a cloud-managed certificate.
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Autoklipp.xcodeproj \
            -scheme Autoklipp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Autoklipp.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | grep -E '(error:|warning: .*[Ss]ign|ARCHIVE (SUCCEEDED|FAILED))' || true
          test -d "$RUNNER_TEMP/Autoklipp.xcarchive"
      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Autoklipp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It shows up in TestFlight once Apple has processed it."
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
